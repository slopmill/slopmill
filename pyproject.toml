[project]
name = "slopmill"
version = "0.2.0"
description = "Write with an AI model that sounds like you: newsletters, posts, reports, in your voice and your design."
readme = "README.md"
license = "MIT AND AGPL-3.0-or-later"         # by part: see LICENSE
license-files = ["LICENSE", "LICENSES/*", "TRADEMARKS.md"]
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sse-starlette>=2",
  "httpx>=0.27",
  "anthropic>=0.40",
  "pypandoc_binary>=1.13",   # a bundled pandoc, so nobody has to install one
  "matplotlib>=3.8",         # draws charts from the writer's numbers
  "pillow>=10",              # takes the location out of uploaded photos
]

[project.optional-dependencies]
test = ["pytest>=8", "beautifulsoup4>=4.12"]
ui = ["playwright>=1.45"]           # the browser suites in tests/ui

[project.scripts]
slopmill = "slopmill.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slopmill*"]

[tool.setuptools.package-data]
slopmill = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
