{% set tag = "ol" if ordered else "ul" %}
<{{ tag }}{% if ordered and start != 1 %} start="{{ start }}"{% endif %} style="margin:0 0 18px;padding-left:24px;font-size:17px;line-height:1.7;color:#222222">
{% for item in items %}
  <li style="margin:0 0 6px">{{ item }}</li>
{% endfor %}
</{{ tag }}>
