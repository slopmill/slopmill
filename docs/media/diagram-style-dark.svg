edf3" text-anchor="start">:::</text><rect x="350" y="256" width="260" height="70" rx="6" fill="#2e2410" stroke="#d29922" stroke-width="1.5"/><text x="364" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">[components.note]</text><text x="364" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ note.html</text><rect x="694" y="256" width="232" height="70" rx="6" fill="#2e2410" stroke="#d29922" stroke-width="1.5"/><text x="706" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">&lt;table style="…"&gt;&lt;tr&gt;&lt;td&gt;</text><text x="706" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">&lt;b&gt;Aside&lt;/b&gt; One short</text><text x="706" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">paragraph.&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;</text><polyline points="286.0,291.0 341.0,291.0" fill="none" stroke="#d29922" stroke-width="1.8" stroke-linejoin="round"/><polygon points="350.0,291.0 341.0,295.5 341.0,286.5" fill="#d29922"/><polyline points="610.0,291.0 685.0,291.0" fill="none" stroke="#d29922" stroke-width="1.8" stroke-linejoin="round"/><polygon points="694.0,291.0 685.0,295.5 685.0,286.5" fill="#d29922"/><text x="480" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">[templates] holds the HTML for each of these.</text><text x="810" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">Every style inline, as email needs.</text><text x="160" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">Markdown, as you write it.</text></svg>
