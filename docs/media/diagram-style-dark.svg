<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Each kind of block in your issue is drawn by the template your style file names for it: a heading by heading.html, a paragraph by paragraph.html with the accent color filled in, a note box by note.html. Out comes HTML with every style written inline."><title>Each kind of block in your issue is drawn by the template your style file names for it: a heading by heading.html, a paragraph by paragraph.html with the accent color filled in, a note box by note.html. Out comes HTML with every style written inline.</title><text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Your issue</text><text x="350" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Your style file</text><text x="680" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">The HTML it makes</text><rect x="20" y="44" width="280" height="300" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><rect x="680" y="44" width="260" height="300" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><rect x="336" y="44" width="288" height="300" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><rect x="34" y="64" width="252" height="60" rx="6" fill="#132d1d" stroke="#3fb950" stroke-width="1.5"/><text x="46" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">## In Which We Begin</text><rect x="350" y="64" width="260" height="60" rx="6" fill="#132d1d" stroke="#3fb950" stroke-width="1.5"/><text x="364" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">[blocks] heading</text><text x="364" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">→ heading.html</text><rect x="694" y="64" width="232" height="60" rx="6" fill="#132d1d" stroke="#3fb950" stroke-width="1.5"/><text x="706" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">&lt;h2 style="…"&gt;</text><text x="706" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">In Which We Begin&lt;/h2&gt;</text><polyline points="286.0,94.0 341.0,94.0" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linejoin="round"/><polygon points="350.0,94.0 341.0,98.5 341.0,89.5" fill="#3fb950"/><polyline points="610.0,94.0 685.0,94.0" fill="none" stroke="#3fb950" stroke-width="1.8" stroke-linejoin="round"/><polygon points="694.0,94.0 685.0,98.5 685.0,89.5" fill="#3fb950"/><rect x="34" y="150" width="252" height="84" rx="6" fill="#1d2d45" stroke="#9fc0ea" stroke-width="1.5"/><text x="46" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">Some **words**{.green}</text><text x="46" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#e6edf3" text-anchor="start">of mine.</text><rect x="350" y="150" width="260" height="84" rx="6" fill="#1d2d45" stroke="#9fc0ea" stroke-width="1.5"/><text x="364" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#e6edf3" text-anchor="start">[blocks] paragraph</text><text x="364" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Consola